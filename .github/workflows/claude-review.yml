name: Claude Code PR Review

# Se dispara cuando alguien comenta "@claude" en un PR, o al abrir/actualizar el PR.
# Requiere el secret ANTHROPIC_API_KEY configurado en el repositorio antes de la demo.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    if: >
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          prompt: |
            Actua como revisor senior de un equipo Java/Spring Boot.
            Lee CLAUDE.md antes de revisar para conocer las convenciones del equipo.
            Revisa el diff de este Pull Request y señala, en comentarios separados:
            1. Vulnerabilidades de seguridad (ej. inyeccion SQL, secretos hardcodeados).
            2. Problemas de rendimiento con JPA/Hibernate (ej. N+1).
            3. Incumplimientos de las convenciones de CLAUDE.md.
            4. Endpoints o metodos nuevos sin test asociado.
            Se conciso y accionable: para cada problema, propon el cambio concreto.

            Cuando termines el analisis, publica el resultado completo como UN
            UNICO comentario en este Pull Request:
            1. Escribe la revision completa en Markdown a un fichero temporal,
               por ejemplo /tmp/review.md (con la herramienta Write, no con Bash).
            2. Averigua el numero de PR con `gh pr view --json number -q .number`.
            3. Publica el fichero con un unico comando:
               gh pr comment <numero-de-PR> --body-file /tmp/review.md
               No uses --body con el texto inline: el Markdown con
               encabezados "#" tras saltos de linea es rechazado por el
               sandbox si se pasa como argumento directo.

            Importante: tu respuesta final de texto NO se publica sola en
            GitHub en este modo. Si no ejecutas `gh pr comment`, la revision
            no sera visible para el equipo.
