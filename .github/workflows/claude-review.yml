name: Claude Code PR Review

# Se dispara cuando alguien comenta "@claude" en un PR, o al abrir/actualizar el PR.
# Requiere el secret ANTHROPIC_API_KEY configurado en el repositorio antes de la demo.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    if: >
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Actua como revisor senior de un equipo Java/Spring Boot.
            Lee CLAUDE.md antes de revisar para conocer las convenciones del equipo.
            Revisa el diff de este Pull Request y señala, en comentarios separados:
            1. Vulnerabilidades de seguridad (ej. inyeccion SQL, secretos hardcodeados).
            2. Problemas de rendimiento con JPA/Hibernate (ej. N+1).
            3. Incumplimientos de las convenciones de CLAUDE.md.
            4. Endpoints o metodos nuevos sin test asociado.
            Se conciso y accionable: para cada problema, propon el cambio concreto.
